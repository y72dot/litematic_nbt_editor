name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - run: npx vite build

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: "/var/www/nbt-editor/releases/${{ github.run_id }}/"
          SCRIPT_AFTER: |
            ln -sfn /var/www/nbt-editor/releases/${{ github.run_id }} /var/www/nbt-editor/current
            ls -dt /var/www/nbt-editor/releases/*/ | tail -n +6 | xargs -r rm -rf
            sudo systemctl reload nginx
